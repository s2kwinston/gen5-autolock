# gen5-autolock settings.  EDIT THE TWO LINES BELOW, then put this file on a USB
# stick together with NEMESIS.data and apply-config.sh, and insert it in the car.
# (See README.txt on the stick for the full step-by-step.)

# 1) ACTUALLY LOCK THE CAR?
#    1 = TEST MODE: it runs and writes to the log but NEVER locks. (safe start)
#    0 = LIVE: it really locks the car.
#    Leave it at 1 for your first few drives, check the car behaves, then set 0.
DRY_RUN=1

# 2) HOW MANY SECONDS AFTER YOU CLOSE THE DOOR BEFORE IT LOCKS.
#    Allowed 5 to 600. 30 is a good start. Keep it under ~90: the real wait is a bit
#    longer than the number (about 1.3-1.8x), and the screen only stays awake ~2-3
#    minutes after you switch off, so a bigger value can miss locking that time.
LOCK_DELAY=30

# ---------------------------------------------------------------------------
# Advanced — leave these alone unless you specifically want to change them.
# Remove the leading '#' to turn a line on.
# ---------------------------------------------------------------------------
# ENABLED=1            # 0 = installed but completely off
# DRIVER_DOOR_ONLY=1   # 1 = only arm when the DRIVER door opens then closes
#                      # 0 = any door (locks more eagerly, more false triggers)
# POLL_ACTIVE=1        # how often it checks after you switch off (seconds, 1-10)
# MAX_FIRES=3          # lock attempts per stop before giving up (1-10)
# CHECK_ODEX=1         # 1 = refuse to run if the car's software changed
