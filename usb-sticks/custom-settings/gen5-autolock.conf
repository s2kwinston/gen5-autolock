# gen5-autolock settings.  Edit the line(s) you want, put this file on the USB stick
# with NEMESIS.data and apply-config.sh, and insert it in the car.
# ONLY the settings written here without a '#' in front are changed. Everything
# else on the car — LIVE/TEST mode, other settings — stays exactly as it is.
# (See README.txt on the stick for the step-by-step.)

# HOW MANY SECONDS AFTER YOU CLOSE THE DOOR BEFORE IT LOCKS.
#    Allowed 5 to 600. 30 is the default. Keep it under ~120: the car only stays
#    lockable for about 3 minutes after you close the door (measured: 178 s).
#    Counted in real seconds; the lock lands a few seconds after this number.
LOCK_DELAY=30

# LIVE vs TEST MODE is normally set with the GO LIVE / TEST MODE sticks and this
# stick leaves it alone. To force it from here, remove the '#' on ONE line:
# DRY_RUN=0            # LIVE: really locks the car
# DRY_RUN=1            # TEST MODE: runs and writes the log, never locks

# ---------------------------------------------------------------------------
# Advanced — leave these alone unless you specifically want to change them.
# Remove the leading '#' to change one.
# ---------------------------------------------------------------------------
# ENABLED=1            # 0 = installed but completely off
# DRIVER_DOOR_ONLY=1   # 1 = only arm when the DRIVER door opens then closes
#                      # 0 = any door (locks more eagerly, more false triggers)
# HOOD_GUARD=1         # 1 = don't lock while the hood/frunk is open; 0 = ignore the hood
# POLL_ACTIVE=1        # how often it checks after you switch off (seconds, 1-10)
# MAX_FIRES=3          # lock attempts per stop before giving up (1-10)
# CHECK_ODEX=1         # 1 = run only on verified (or pinned) car software
